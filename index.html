<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periodic Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Periodic Table</h1>
  <div class="periodic-table">
    <div class="element" style="grid-column:1;grid-row:1"><span>1</span><strong>H</strong><small>Hydrogen</small></div>
    <div class="element noble" style="grid-column:18;grid-row:1"><span>2</span><strong>He</strong><small>Helium</small></div>

    <div class="element alkali" style="grid-column:1;grid-row:2"><span>3</span><strong>Li</strong><small>Lithium</small></div>
    <div class="element alkaline" style="grid-column:2;grid-row:2"><span>4</span><strong>Be</strong><small>Beryllium</small></div>
    <div class="element metalloid" style="grid-column:13;grid-row:2"><span>5</span><strong>B</strong><small>Boron</small></div>
    <div class="element nonmetal" style="grid-column:14;grid-row:2"><span>6</span><strong>C</strong><small>Carbon</small></div>
    <div class="element nonmetal" style="grid-column:15;grid-row:2"><span>7</span><strong>N</strong><small>Nitrogen</small></div>
    <div class="element nonmetal" style="grid-column:16;grid-row:2"><span>8</span><strong>O</strong><small>Oxygen</small></div>
    <div class="element halogen" style="grid-column:17;grid-row:2"><span>9</span><strong>F</strong><small>Fluorine</small></div>
    <div class="element noble" style="grid-column:18;grid-row:2"><span>10</span><strong>Ne</strong><small>Neon</small></div>

    <div class="element alkali" style="grid-column:1;grid-row:3"><span>11</span><strong>Na</strong><small>Sodium</small></div>
    <div class="element alkaline" style="grid-column:2;grid-row:3"><span>12</span><strong>Mg</strong><small>Magnesium</small></div>
    <div class="element metal" style="grid-column:13;grid-row:3"><span>13</span><strong>Al</strong><small>Aluminium</small></div>
    <div class="element metalloid" style="grid-column:14;grid-row:3"><span>14</span><strong>Si</strong><small>Silicon</small></div>
    <div class="element nonmetal" style="grid-column:15;grid-row:3"><span>15</span><strong>P</strong><small>Phosphorus</small></div>
    <div class="element nonmetal" style="grid-column:16;grid-row:3"><span>16</span><strong>S</strong><small>Sulfur</small></div>
    <div class="element halogen" style="grid-column:17;grid-row:3"><span>17</span><strong>Cl</strong><small>Chlorine</small></div>
    <div class="element noble" style="grid-column:18;grid-row:3"><span>18</span><strong>Ar</strong><small>Argon</small></div>

    <div class="element alkali" style="grid-column:1;grid-row:4"><span>19</span><strong>K</strong><small>Potassium</small></div>
    <div class="element alkaline" style="grid-column:2;grid-row:4"><span>20</span><strong>Ca</strong><small>Calcium</small></div>
  </div>
</body>
</html>
